<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>findr.</title>
<link rel="icon" type="image/x-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--bg2:#131316;--bg3:#1c1c20;--text:#e6e6e0;--muted:#888880;--dim:#444440;--accent:#c8a96e;--abg:rgba(200,169,110,0.12);--border:rgba(255,255,255,0.07);--green:#6ec87a;--blue:#8888ff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Raleway',sans-serif}

/* SETUP */
#setup{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
.s-logo{font-size:2.4rem;font-weight:800;letter-spacing:0.1em;margin-bottom:6px}
.s-logo span{color:var(--accent)}
.s-sub{font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:44px;font-weight:600}

/* SCREENS */
.screen{position:fixed;inset:0;transition:transform 0.46s cubic-bezier(0.4,0,0.2,1),opacity 0.46s ease;z-index:1}
.screen.hidden{pointer-events:none;opacity:0}
#sr{transform:translateX(0)}
#sr.hidden{opacity:0}
#sd{transform:translateX(100%);opacity:1}
#sd.active{transform:translateX(0);opacity:1}
#swl{transform:translateX(-100%);opacity:1}
#swl.active{transform:translateX(0);opacity:1}

/* PERSON SCREEN — slides up from bottom */
#sp{position:fixed;inset:0;z-index:2;background:var(--bg);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;transform:translateY(100%);transition:transform 0.46s cubic-bezier(0.4,0,0.2,1);opacity:1!important}
#sp::-webkit-scrollbar{display:none}
#sp.active{transform:translateY(0)}

/* TOPBAR */
.topbar{position:absolute;top:0;left:0;right:0;z-index:10;padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(9,9,11,0.97) 0%,transparent 100%);pointer-events:none;transition:opacity 0.3s}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:0.1em;pointer-events:all;cursor:default}
.logo span{color:var(--accent)}
.tbns{display:flex;gap:12px;pointer-events:all}
.tbtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:5px;transition:color 0.2s}
.tbtn:hover{color:var(--text)}
.tbtn svg{display:block;width:18px;height:18px}

/* REEL */
#rc{width:100%;height:100%;overflow:hidden;position:relative;touch-action:none}
.rt{display:flex;flex-direction:column;will-change:transform;transition:transform 0.43s cubic-bezier(0.4,0,0.2,1)}
.reel{width:100%;height:100dvh;position:relative;flex-shrink:0;overflow:hidden;background:#000}
.reel-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel-ov{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(9,9,11,0.18) 0%,transparent 28%,transparent 54%,rgba(9,9,11,0.52) 78%,rgba(9,9,11,0.92) 100%)}
.reel-tz{position:absolute;inset:0;z-index:4;cursor:pointer}
.reel-meta{position:absolute;bottom:72px;left:20px;right:62px;z-index:5;pointer-events:none}
.reel-title{font-size:clamp(1.25rem,5vw,2rem);font-weight:700;letter-spacing:-0.01em;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,0.5)}
.reel-year{font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:500}
.reel-gtags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.reel-gt{font-size:0.56rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;padding:2px 7px;border:1px solid rgba(255,255,255,0.14);border-radius:2px;color:rgba(230,230,224,0.65)}
.reel-bm{position:absolute;bottom:68px;right:14px;z-index:6;background:none;border:none;cursor:pointer;color:var(--text);padding:8px;transition:transform 0.16s ease}
.reel-bm svg{display:block;width:24px;height:24px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6));transition:fill 0.2s,stroke 0.2s}
.reel-bm.saved svg{fill:var(--accent) !important;stroke:var(--accent) !important}
.reel-bm:active{transform:scale(1.3)}

/* load more */
.lm-reel{width:100%;height:100dvh;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SEARCH */
.sw{position:absolute;top:0;left:0;right:0;z-index:20;padding:15px 17px;background:rgba(9,9,11,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transform:translateY(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1)}
.sw.open{transform:translateY(0)}
.srow{display:flex;gap:9px;align-items:center}
.si{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Raleway',sans-serif;font-size:0.87rem;padding:10px 13px;border-radius:4px;outline:none;transition:border-color 0.2s}
.si:focus{border-color:rgba(200,169,110,0.45)}
.si::placeholder{color:var(--dim)}
.scb{background:none;border:none;cursor:pointer;color:var(--muted);font-family:'Raleway',sans-serif;font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;padding:8px}
.sres{max-height:46vh;overflow-y:auto;margin-top:10px;scrollbar-width:none}
.sres::-webkit-scrollbar{display:none}
.sri{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.18s}
.sri:hover{opacity:0.7}
.sri-p{width:32px;height:48px;object-fit:cover;border-radius:2px;background:var(--bg3);flex-shrink:0}
.sri-t{font-size:0.82rem;font-weight:600}
.sri-m{font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}

/* DETAILS */
#sd{background:var(--bg);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#sd::-webkit-scrollbar{display:none}
.back-btn{position:sticky;top:16px;left:16px;z-index:20;background:rgba(9,9,11,0.85);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);transition:opacity 0.2s;float:left;margin:16px 0 -60px 16px;clear:left}
.back-btn:hover{opacity:0.7}
.dh{position:relative;width:100%;height:60vmax;max-height:490px;min-height:240px;overflow:hidden}
.dh-bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dh-g{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 22%,var(--bg) 100%)}
.dh-cnt{position:absolute;bottom:0;left:0;right:0;padding:20px 18px 0;display:flex;gap:13px;align-items:flex-end}
.d-poster{width:40px;flex-shrink:0;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,0.65);aspect-ratio:2/3;object-fit:cover}
.d-tb{flex:1;min-width:0;padding-bottom:5px}
.d-title{font-size:clamp(1.1rem,4.5vw,1.8rem);font-weight:700;line-height:1.1;letter-spacing:-0.01em}
.d-tl{font-size:0.7rem;color:var(--muted);font-style:italic;margin-top:4px;font-family:Georgia,serif;letter-spacing:0.03em}
.d-bdg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bdg{font-size:0.57rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:700;padding:3px 7px;border:1px solid var(--border);color:var(--muted);border-radius:2px}
.bdg.th{border-color:rgba(200,169,110,0.5);color:var(--accent);background:var(--abg)}
.bdg.st{border-color:rgba(110,200,122,0.4);color:var(--green);background:rgba(110,200,122,0.08)}
.bdg.up{border-color:rgba(136,136,255,0.4);color:var(--blue);background:rgba(136,136,255,0.08)}

/* DETAIL BOOKMARK BUTTON */
.d-bm-btn{flex-shrink:0;align-self:flex-start;margin-top:2px;background:rgba(9,9,11,0.55);border:1px solid var(--border);backdrop-filter:blur(10px);border-radius:50%;width:38px;height:38px;min-width:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);transition:transform 0.16s}
.d-bm-btn:active{transform:scale(1.2)}
.d-bm-btn svg{width:17px;height:17px;transition:fill 0.2s,stroke 0.2s}
.d-bm-btn.saved svg{fill:var(--accent)!important;stroke:var(--accent)!important}

.d-body{padding:17px 18px 80px}
.slbl{font-size:0.57rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.dsec{margin-bottom:26px}
.av-card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:12px 14px;margin-bottom:26px}
.av-lbl{font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px}
.av-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:4px}
.av-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px}
.av-t{font-size:0.77rem;color:var(--text);font-weight:500}
.av-s{font-size:0.66rem;color:var(--muted);margin-top:1px}
.syn{font-size:0.87rem;line-height:1.82;color:rgba(230,230,224,0.85);font-family:Georgia,serif;letter-spacing:0.01em}
.cast-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.cast-row::-webkit-scrollbar{display:none}
.cc{flex-shrink:0;width:68px;cursor:pointer}
.cc-img{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--bg3);border:1px solid var(--border);display:block;margin-bottom:5px;transition:opacity 0.18s}
.cc:hover .cc-img{opacity:0.75}
.cc-n{font-size:0.59rem;font-weight:700;text-align:center;line-height:1.3}
.cc-r{font-size:0.57rem;color:var(--muted);text-align:center;margin-top:1px}
.crew-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.crew-item{cursor:pointer;padding:4px 0;transition:opacity 0.18s}
.crew-item:hover{opacity:0.7}
.cr-role{font-size:0.57rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:2px}
.cr-name{font-size:0.78rem;font-weight:500;color:var(--text);border-bottom:1px solid transparent;transition:border-color 0.2s}
.crew-item:hover .cr-name{border-color:var(--accent)}
.media-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.media-row::-webkit-scrollbar{display:none}
.mt{flex-shrink:0;width:170px;border-radius:3px;overflow:hidden;background:var(--bg3);cursor:pointer;position:relative}
.mt img{width:100%;height:96px;object-fit:cover;display:block}
.mt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.28)}
.mt-play svg{width:33px;height:33px;color:#fff;opacity:0.85}
.mt-n{font-size:0.6rem;padding:5px 7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px}
.sc{cursor:pointer}
.sc-p{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;background:var(--bg3);display:block}
.sc-t{font-size:0.58rem;margin-top:3px;font-weight:600;line-height:1.25}
.sc-y{font-size:0.55rem;color:var(--muted)}

/* WATCH LATER */
#swl{background:var(--bg);overflow-y:auto;scrollbar-width:none}
#swl::-webkit-scrollbar{display:none}
.wl-h{padding:72px 18px 16px}
.wl-title{font-size:1.4rem;font-weight:800;letter-spacing:-0.01em}
.wl-cnt{font-size:0.66rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-top:3px;font-weight:600}
.wl-back{position:absolute;top:16px;right:16px;z-index:20;background:rgba(9,9,11,0.85);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:0 16px 80px}
.wlc{cursor:pointer;position:relative}
.wlc-p{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;background:var(--bg3);display:block}
.wlc-i{padding:6px 0}
.wlc-t{font-size:0.68rem;font-weight:600;line-height:1.3}
.wlc-m{font-size:0.58rem;color:var(--muted);margin-top:2px}
.wlc-rm{position:absolute;top:5px;right:5px;width:25px;height:25px;border-radius:50%;background:rgba(9,9,11,0.8);backdrop-filter:blur(8px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.wlc-rm svg{width:11px;height:11px}
.wl-empty{grid-column:1/-1;text-align:center;padding:60px 28px;color:var(--dim);font-size:0.8rem;line-height:2;letter-spacing:0.04em}
.wl-ei{font-size:2rem;opacity:0.22;margin-bottom:12px}

/* TOAST */
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(20,20,23,0.97);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:3px;padding:8px 15px;font-size:0.68rem;letter-spacing:0.13em;text-transform:uppercase;font-weight:700;color:var(--text);z-index:700;opacity:0;transition:opacity 0.26s,transform 0.26s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* VIDEO MODAL */
.vm{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.94);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.26s}
.vm.open{opacity:1;pointer-events:all}
.vm-i{width:93%;max-width:680px;position:relative}
.vm-close{position:absolute;top:-36px;right:0;background:none;border:none;cursor:pointer;color:#fff;font-family:'Raleway',sans-serif;font-size:0.66rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:700}
.vm-i iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:3px}

/* LOAD BAR */
.lb{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:1000;transition:width 0.4s,opacity 0.5s;box-shadow:0 0 7px var(--accent)}

/* SWIPE HINT */
.sh{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:0.59rem;letter-spacing:0.22em;color:var(--dim);text-transform:uppercase;z-index:60;pointer-events:none;animation:fh 4.5s ease forwards}
@keyframes fh{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* FILTER MENU */
.fmenu{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity 0.3s;pointer-events:none}
.fmenu.open{display:flex;opacity:1;pointer-events:all}
.fpanel{width:100%;max-width:500px;background:var(--bg2);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:20px;max-height:75vh;overflow-y:auto;animation:slideUp 0.3s ease;scrollbar-width:none}
.fpanel::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fpanel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.fpanel-title{font-size:0.85rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase}
.fpanel-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.4rem;line-height:1;transition:color 0.2s}
.fpanel-close:hover{color:var(--text)}
.fsec{margin-bottom:20px}
.fsec-lbl{font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;display:block}
.fyr-container{display:flex;gap:10px;align-items:center}
.fyr-input{width:72px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Raleway',sans-serif;font-size:0.82rem;padding:8px 10px;border-radius:3px;outline:none;text-align:center}
.fyr-input:focus{border-color:var(--accent)}
.fyr-separator{color:var(--muted);font-size:1rem}
.fgenre-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fgenre-tag{padding:7px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);font-family:'Raleway',sans-serif;font-size:0.68rem;cursor:pointer;transition:all 0.2s;font-weight:600;text-align:center}
.fgenre-tag:hover,.fgenre-tag.selected{border-color:var(--accent);color:var(--accent);background:var(--abg)}
.flang-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.flang-tag{padding:7px 6px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);font-family:'Raleway',sans-serif;font-size:0.65rem;cursor:pointer;transition:all 0.2s;font-weight:600;text-align:center}
.flang-tag:hover,.flang-tag.selected{border-color:var(--accent);color:var(--accent);background:var(--abg)}
.ftype-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ftype-tag{padding:7px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);font-family:'Raleway',sans-serif;font-size:0.68rem;cursor:pointer;transition:all 0.2s;font-weight:600;text-align:center}
.ftype-tag:hover,.ftype-tag.on{border-color:var(--accent);color:var(--accent);background:var(--abg)}
.fbtns-row{display:flex;gap:8px;margin-top:18px}
.fapply-btn{flex:1;padding:11px;background:var(--accent);border:none;border-radius:4px;color:#19130a;font-family:'Raleway',sans-serif;font-size:0.74rem;letter-spacing:0.16em;text-transform:uppercase;font-weight:800;cursor:pointer;transition:opacity 0.2s}
.fapply-btn:hover{opacity:0.85}
.freset-btn{flex:0 0 auto;padding:11px 16px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:'Raleway',sans-serif;font-size:0.74rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:all 0.2s}
.freset-btn:hover{border-color:var(--accent);color:var(--accent)}

/* RESPONSIVE */
@media(min-width:540px){#rc{max-width:390px;margin:0 auto}}
@media(min-width:768px){
  .d-body{max-width:860px;margin:0 auto;padding-left:32px;padding-right:32px}
  .dh-cnt{max-width:860px;margin:0 auto;left:50%;transform:translateX(-50%);right:auto;width:100%}
  .wl-h{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
  .wl-grid{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media(min-width:1200px){
  .wl-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sim-g{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}

/* AVAILABILITY */
.av-platform-line{font-size:0.85rem;font-weight:500;color:var(--text);line-height:1.6;padding:2px 0}
.av-platform-link{color:var(--green);text-decoration:none;font-weight:700;border-bottom:1px solid rgba(110,200,122,0.35);padding-bottom:1px;transition:border-color 0.2s,color 0.2s}
.av-platform-link:hover{color:#8ee89a;border-color:rgba(110,200,122,0.8)}
.av-platform-name{color:var(--green);font-weight:700}
.av-sep{color:var(--muted)}
.av-muted{color:var(--muted);font-size:0.78rem}

/* PERSON PROFILE */
.ph-back{position:sticky;top:0;z-index:20;padding:16px 20px 0;background:var(--bg);display:flex;align-items:center;gap:14px}
.ph-back-btn{background:rgba(9,9,11,0.85);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:50%;width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);transition:opacity 0.2s;flex-shrink:0}
.ph-back-btn:hover{opacity:0.7}
.ph-back-title{font-size:0.68rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ph-hero{padding:24px 20px 20px;display:flex;gap:18px;align-items:flex-end;background:linear-gradient(to bottom,var(--bg2),var(--bg));border-bottom:1px solid var(--border)}
.ph-img-wrap{flex-shrink:0;position:relative}
.ph-img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--bg3);border:2px solid var(--border);display:block}

.ph-info{flex:1;min-width:0}
.ph-name{font-size:clamp(1.2rem,4.5vw,1.8rem);font-weight:800;letter-spacing:-0.01em;line-height:1.1}
.ph-dept{font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:6px}
.ph-meta-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ph-badge{font-size:0.57rem;letter-spacing:0.13em;text-transform:uppercase;font-weight:700;padding:3px 8px;border:1px solid var(--border);color:var(--muted);border-radius:2px}

.ph-body{padding:20px 20px 80px}
.ph-lbl{font-size:0.57rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.ph-sec{margin-bottom:28px}

.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:28px}
.ph-stat{background:var(--bg2);padding:14px 8px;text-align:center}
.ph-stat-n{font-size:1.25rem;font-weight:800;color:var(--accent);letter-spacing:-0.02em;line-height:1}
.ph-stat-l{font-size:0.52rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}

.ph-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph-ig-lbl{font-size:0.57rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:3px}
.ph-ig-val{font-size:0.82rem;font-weight:500;color:var(--text);line-height:1.4}

.ph-lang-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ph-lang-tag{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;padding:3px 8px;border:1px solid var(--border);color:var(--muted);border-radius:2px}

.ph-bio{font-size:0.87rem;line-height:1.82;color:rgba(230,230,224,0.85);font-family:Georgia,serif;letter-spacing:0.01em}
.ph-bio.collapsed{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ph-bio-toggle{background:none;border:none;cursor:pointer;color:var(--accent);font-family:'Raleway',sans-serif;font-size:0.7rem;letter-spacing:0.1em;font-weight:700;margin-top:8px;padding:0;display:block;transition:opacity 0.2s}
.ph-bio-toggle:hover{opacity:0.7}

.ph-sort-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ph-sort-sel{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Raleway',sans-serif;font-size:0.66rem;padding:7px 10px;border-radius:3px;outline:none;cursor:pointer;letter-spacing:0.05em;transition:border-color 0.2s}
.ph-sort-sel:focus{border-color:var(--accent)}
.ph-sort-dir{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:'Raleway',sans-serif;font-size:0.66rem;padding:7px 12px;border-radius:3px;cursor:pointer;transition:all 0.2s;letter-spacing:0.05em}
.ph-sort-dir:hover{border-color:var(--accent);color:var(--accent)}
.ph-film-count{font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;margin-left:auto;align-self:center}

.ph-film-list{display:flex;flex-direction:column}
.ph-film-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.18s}
.ph-film-item:hover{opacity:0.72}
.ph-film-poster{width:34px;height:50px;object-fit:cover;border-radius:2px;background:var(--bg3);flex-shrink:0}
.ph-film-info{flex:1;min-width:0}
.ph-film-title{font-size:0.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-film-meta{font-size:0.62rem;color:var(--muted);margin-top:2px;letter-spacing:0.05em}
.ph-film-role{font-size:0.6rem;color:var(--dim);margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-film-year{font-size:0.72rem;font-weight:700;color:var(--muted);flex-shrink:0;min-width:36px;text-align:right}
.ph-empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:0.78rem;line-height:1.8}

@media(min-width:768px){
  .ph-body{max-width:860px;margin:0 auto}
  .ph-stats{grid-template-columns:repeat(6,1fr)}
  .ph-info-grid{grid-template-columns:repeat(3,1fr)}
  .ph-back{max-width:860px;margin:0 auto;padding-left:32px;padding-right:32px}
  .ph-hero{max-width:860px;margin:0 auto;padding-left:32px;padding-right:32px}
}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup">
  <div class="s-logo">findr<span>.</span></div>
  <div class="s-sub">follow what comes after</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="lb" id="lb" style="width:0"></div>

  <!-- Reel screen -->
  <div class="screen" id="sr">
    <div class="topbar" id="topbar">
      <div class="logo">findr<span>.</span></div>
      <div class="tbns">
        <button class="tbtn" onclick="openSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
        <button class="tbtn" onclick="openFilterMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.586a1 1 0 0 1-.293.707l-6.414 6.414a1 1 0 0 0-.293.707V17l-4 4v-6.586a1 1 0 0 0-.293-.707L3.293 7.293A1 1 0 0 1 3 6.586V4z"/></svg></button>
        <button class="tbtn" onclick="openWL()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </div>
    <div class="sw" id="sw">
      <div class="srow">
        <input class="si" id="si" placeholder="Search movies, series, actors…" oninput="doSearch()">
        <button class="scb" onclick="closeSearch()">Done</button>
      </div>
      <div class="sres" id="sres"></div>
    </div>
    <div id="rc">
      <div class="rt" id="rt"></div>
    </div>
  </div>

  <!-- Details screen -->
  <div class="screen hidden" id="sd">
    <button class="back-btn" onclick="closeDetails()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div id="dc"></div>
  </div>

  <!-- Watch Later screen -->
  <div class="screen hidden" id="swl">
    <button class="wl-back" onclick="closeWL()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 19l7-7-7-7"/></svg>
    </button>
    <div class="wl-h"><div class="wl-title">Watch Later</div><div class="wl-cnt" id="wlcnt"></div></div>
    <div class="wl-grid" id="wlgrid"></div>
  </div>

  <!-- Person profile screen -->
  <div id="sp">
    <div id="spc"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="vm" id="vm" onclick="vmBg(event)">
    <div class="vm-i">
      <button class="vm-close" onclick="closeVM()">✕ Close</button>
      <iframe id="vmf" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <!-- Filter Menu -->
  <div class="fmenu" id="fmenu" onclick="fmenuScrimClick(event)">
    <div class="fpanel">
      <div class="fpanel-header">
        <div class="fpanel-title">Discover Filters</div>
        <button class="fpanel-close" onclick="closeFilterMenu()">×</button>
      </div>
      <div class="fsec">
        <label class="fsec-lbl">Content Type</label>
        <div class="ftype-grid">
          <button class="ftype-tag on" onclick="toggleTypeFilter(this,'all')">All</button>
          <button class="ftype-tag" onclick="toggleTypeFilter(this,'movie')">Movies</button>
          <button class="ftype-tag" onclick="toggleTypeFilter(this,'tv')">Series</button>
          <button class="ftype-tag" onclick="toggleTypeFilter(this,'trending')">Trending</button>
          <button class="ftype-tag" onclick="toggleTypeFilter(this,'theatre')">In Theatres</button>
          <button class="ftype-tag" onclick="toggleTypeFilter(this,'streaming')">Streaming</button>
        </div>
      </div>
      <div class="fsec">
        <label class="fsec-lbl">Year Range</label>
        <div class="fyr-container">
          <input class="fyr-input" type="number" id="yearFrom" placeholder="1950" min="1900" max="2100">
          <span class="fyr-separator">–</span>
          <input class="fyr-input" type="number" id="yearTo" placeholder="2025" min="1900" max="2100">
        </div>
      </div>
      <div class="fsec">
        <label class="fsec-lbl">Genre</label>
        <div class="fgenre-grid">
          <button class="fgenre-tag" onclick="toggleGenre(this,'Action')">Action</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Comedy')">Comedy</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Drama')">Drama</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Horror')">Horror</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Romance')">Romance</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Science Fiction')">Sci-Fi</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Thriller')">Thriller</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Animation')">Animation</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Crime')">Crime</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Adventure')">Adventure</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Fantasy')">Fantasy</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Mystery')">Mystery</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Documentary')">Documentary</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'War')">War</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'History')">History</button>
          <button class="fgenre-tag" onclick="toggleGenre(this,'Western')">Western</button>
        </div>
      </div>
      <div class="fsec">
        <label class="fsec-lbl">Language</label>
        <div class="flang-grid">
          <button class="flang-tag" onclick="toggleLang(this,'en')">English</button>
          <button class="flang-tag" onclick="toggleLang(this,'hi')">Hindi</button>
          <button class="flang-tag" onclick="toggleLang(this,'ml')">Malayalam</button>
          <button class="flang-tag" onclick="toggleLang(this,'ta')">Tamil</button>
          <button class="flang-tag" onclick="toggleLang(this,'te')">Telugu</button>
          <button class="flang-tag" onclick="toggleLang(this,'ko')">Korean</button>
          <button class="flang-tag" onclick="toggleLang(this,'ja')">Japanese</button>
          <button class="flang-tag" onclick="toggleLang(this,'fr')">French</button>
          <button class="flang-tag" onclick="toggleLang(this,'es')">Spanish</button>
          <button class="flang-tag" onclick="toggleLang(this,'de')">German</button>
          <button class="flang-tag" onclick="toggleLang(this,'zh')">Chinese</button>
          <button class="flang-tag" onclick="toggleLang(this,'it')">Italian</button>
        </div>
      </div>
      <div class="fbtns-row">
        <button class="fapply-btn" onclick="applyAdvancedFilters()">Apply Filters</button>
        <button class="freset-btn" onclick="clearAndReload()">Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
const IMGW = 'https://image.tmdb.org/t/p/original';
const IMGP = 'https://image.tmdb.org/t/p/w780';
const IMGC = 'https://image.tmdb.org/t/p/w342';
const KEY  = ['65a86fe','fe03dca5','fdd0f6e0','0bfbac7d2'].join('');
let reels      = [];
let idx        = 0;
let screen     = 'reel';
let busy       = false;
let wl         = [];
let typeFilter = 'all';
let curDet     = null;
const seen     = new Set();
let srcIdx     = 0;
let pg         = 1;
let loading    = false;
const SRCS     = ['trending_movie','trending_tv','popular_movie','top_rated_movie','popular_tv','now_playing_movie'];

let reelsFilters = { yearFrom:null, yearTo:null, genres:new Set(), languages:new Set() };

/* ── LANGUAGE NAMES ── */
const LANG_NAMES = {
  en:'English',hi:'Hindi',ml:'Malayalam',ta:'Tamil',te:'Telugu',
  kn:'Kannada',bn:'Bengali',pa:'Punjabi',mr:'Marathi',ur:'Urdu',
  ko:'Korean',ja:'Japanese',zh:'Chinese',fr:'French',es:'Spanish',
  de:'German',it:'Italian',pt:'Portuguese',ru:'Russian',ar:'Arabic',
  tr:'Turkish',th:'Thai',id:'Indonesian',vi:'Vietnamese',nl:'Dutch',
  sv:'Swedish',da:'Danish',fi:'Finnish',pl:'Polish',ro:'Romanian'
};
function langName(code){ return LANG_NAMES[(code||'').toLowerCase()]||(code||'').toUpperCase(); }

/* ── TMDB GENRE IDS ── */
const GENRE_IDS_MOVIE = {
  'Action':28,'Adventure':12,'Animation':16,'Comedy':35,'Crime':80,
  'Documentary':99,'Drama':18,'Fantasy':14,'History':36,'Horror':27,
  'Mystery':9648,'Romance':10749,'Science Fiction':878,'Thriller':53,'War':10752,'Western':37
};
const GENRE_IDS_TV = {
  'Action':10759,'Adventure':10759,'Animation':16,'Comedy':35,'Crime':80,
  'Documentary':99,'Drama':18,'Fantasy':10765,'Mystery':9648,'Reality':10764,
  'Romance':10749,'Science Fiction':10765,'Thriller':9648,'War':10768,'Western':37
};

/* ═══════════════════════════════════════
   SETUP
═══════════════════════════════════════ */
async function launchApp(){ launch(); }
async function launch(){
  try { wl = JSON.parse(localStorage.getItem('findr_wl')||'[]'); } catch(e){ wl=[]; }
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='block';
  setLoad(10);
  await fetchMore();
  setLoad(100);
  buildTrack();
  setupGestures();
  watchEnd();
  setTimeout(()=>{ document.getElementById('lb').style.opacity='0'; showHint(); }, 600);
}
window.addEventListener('DOMContentLoaded',()=>{ setTimeout(()=>launchApp(),2400); });

/* ═══════════════════════════════════════
   FILTER MENU
═══════════════════════════════════════ */
function openFilterMenu(){ document.getElementById('fmenu').classList.add('open'); }
function closeFilterMenu(){ document.getElementById('fmenu').classList.remove('open'); }
function fmenuScrimClick(e){ if(e.target===document.getElementById('fmenu')) closeFilterMenu(); }
function toggleGenre(btn,genre){ btn.classList.toggle('selected'); if(btn.classList.contains('selected')) reelsFilters.genres.add(genre); else reelsFilters.genres.delete(genre); }
function toggleLang(btn,lang){ btn.classList.toggle('selected'); if(btn.classList.contains('selected')) reelsFilters.languages.add(lang.toLowerCase()); else reelsFilters.languages.delete(lang.toLowerCase()); }
function toggleTypeFilter(btn,type){ document.querySelectorAll('.ftype-tag').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); typeFilter=type; }

async function applyAdvancedFilters(){
  const yearFrom=document.getElementById('yearFrom').value;
  const yearTo=document.getElementById('yearTo').value;
  reelsFilters.yearFrom=yearFrom?parseInt(yearFrom):null;
  reelsFilters.yearTo=yearTo?parseInt(yearTo):null;
  closeFilterMenu();
  const hasFilters=reelsFilters.yearFrom||reelsFilters.yearTo||reelsFilters.genres.size>0||reelsFilters.languages.size>0||typeFilter!=='all';
  if(!hasFilters){ showToast('No filters set'); return; }
  reels=[]; seen.clear(); srcIdx=0; pg=1;
  document.getElementById('rt').innerHTML='';
  showToast('Discovering…');
  await fetchFiltered();
  buildTrack(); idx=0;
  document.getElementById('rt').style.transform='translateY(0)';
}

async function fetchFiltered(){
  if(loading) return;
  loading=true;
  try {
    const isTVOnly=typeFilter==='tv', isMovOnly=typeFilter==='movie'||typeFilter==='theatre';
    const isStreaming=typeFilter==='streaming', isTrending=typeFilter==='trending';
    const requests=[];
    if(isTrending){
      let qs=''; if(reelsFilters.languages.size===1) qs=`with_original_language=${[...reelsFilters.languages][0]}`;
      requests.push(api('/trending/movie/week',`page=${pg}&${qs}`).then(d=>(d.results||[]).map(m=>({...m,media_type:'movie'}))));
      requests.push(api('/trending/tv/week',`page=${pg}&${qs}`).then(d=>(d.results||[]).map(m=>({...m,media_type:'tv'}))));
    } else {
      if(!isTVOnly){
        let qs=`sort_by=popularity.desc&page=${pg}&include_adult=false`;
        if(reelsFilters.yearFrom) qs+=`&primary_release_date.gte=${reelsFilters.yearFrom}-01-01`;
        if(reelsFilters.yearTo)   qs+=`&primary_release_date.lte=${reelsFilters.yearTo}-12-31`;
        if(reelsFilters.languages.size===1) qs+=`&with_original_language=${[...reelsFilters.languages][0]}`;
        if(reelsFilters.genres.size>0){ const ids=[...reelsFilters.genres].map(g=>GENRE_IDS_MOVIE[g]).filter(Boolean); if(ids.length) qs+=`&with_genres=${ids.join('|')}`; }
        if(isStreaming) qs+=`&with_release_type=4|5|6`;
        if(typeFilter==='theatre') qs+=`&with_release_type=2|3`;
        requests.push(api('/discover/movie',qs).then(d=>(d.results||[]).map(m=>({...m,media_type:'movie'}))));
      }
      if(!isMovOnly&&!isStreaming){
        let qs=`sort_by=popularity.desc&page=${pg}&include_adult=false`;
        if(reelsFilters.yearFrom) qs+=`&first_air_date.gte=${reelsFilters.yearFrom}-01-01`;
        if(reelsFilters.yearTo)   qs+=`&first_air_date.lte=${reelsFilters.yearTo}-12-31`;
        if(reelsFilters.languages.size===1) qs+=`&with_original_language=${[...reelsFilters.languages][0]}`;
        if(reelsFilters.genres.size>0){ const ids=[...reelsFilters.genres].map(g=>GENRE_IDS_TV[g]).filter(Boolean); if(ids.length) qs+=`&with_genres=${ids.join('|')}`; }
        requests.push(api('/discover/tv',qs).then(d=>(d.results||[]).map(m=>({...m,media_type:'tv'}))));
      }
    }
    pg++;
    const results=(await Promise.all(requests)).flat();
    const items=shuffle(results.filter(m=>m.backdrop_path&&!seen.has(m.id))).slice(0,8);
    const enriched=(await Promise.all(items.map(enrich))).filter(Boolean);
    enriched.forEach(m=>seen.add(m.id));
    reels=reels.concat(enriched);
  } catch(e){ console.error('fetchFiltered:',e); }
  loading=false;
}

function clearAndReload(){
  reelsFilters={yearFrom:null,yearTo:null,genres:new Set(),languages:new Set()};
  typeFilter='all';
  document.querySelectorAll('.fgenre-tag.selected').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.flang-tag.selected').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.ftype-tag').forEach(b=>b.classList.remove('on'));
  document.querySelector('.ftype-tag').classList.add('on');
  document.getElementById('yearFrom').value='';
  document.getElementById('yearTo').value='';
  reels=[]; seen.clear(); srcIdx=0; pg=1;
  document.getElementById('rt').innerHTML='';
  closeFilterMenu();
  fetchMore().then(buildTrack);
  showToast('Filters cleared');
}

/* ═══════════════════════════════════════
   TMDB API
═══════════════════════════════════════ */
async function api(path,qs=''){
  const r=await fetch(`https://api.themoviedb.org/3${path}?api_key=${KEY}&${qs}`);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
const SRC_FN={
  trending_movie: p=>api('/trending/movie/week',`page=${p}`),
  trending_tv:    p=>api('/trending/tv/week',`page=${p}`),
  popular_movie:  p=>api('/movie/popular',`page=${p}`),
  top_rated_movie:p=>api('/movie/top_rated',`page=${p}`),
  popular_tv:     p=>api('/tv/popular',`page=${p}`),
  now_playing_movie:p=>api('/movie/now_playing',`page=${p}`),
};

async function fetchMore(){
  if(loading) return;
  loading=true;
  try {
    const src=SRCS[srcIdx%SRCS.length]; srcIdx++;
    const data=await SRC_FN[src](pg); pg++;
    const items=shuffle((data.results||[]).filter(m=>m.backdrop_path&&!seen.has(m.id))).slice(0,8);
    const enriched=(await Promise.all(items.map(enrich))).filter(Boolean);
    enriched.forEach(m=>seen.add(m.id));
    reels=reels.concat(enriched);
  } catch(e){ console.error(e); }
  loading=false;
}

async function enrich(raw){
  try {
    const isTV=raw.media_type==='tv'||raw.name!=null;
    const type=isTV?'tv':'movie';
    const id=raw.id;
    const [det,vids]=await Promise.all([
      api(`/${type}/${id}`,'append_to_response=credits,similar'),
      api(`/${type}/${id}/videos`)
    ]);
    const vs=vids.results||[];
    const title=det.title||det.name||'';
    const year=(det.release_date||det.first_air_date||'').slice(0,4);
    const runtime=det.runtime||(det.episode_run_time?.[0])||0;
    const genres=(det.genres||[]).map(g=>g.name).slice(0,3);
    const poster=det.poster_path?IMGP+det.poster_path:'';
    const backdrop=det.backdrop_path?IMGW+det.backdrop_path:'';
    const lang=(det.original_language||'').toLowerCase();
    // Cast: store id for person page routing
    const cast=(det.credits?.cast||[]).slice(0,6).map(c=>({
      id:c.id, name:c.name, role:c.character, img:c.profile_path?IMGC+c.profile_path:''
    }));
    const rawCrew=det.credits?.crew||[];
    // Crew: store id and name together for person page routing
    const pickCrew=(...jobs)=>{
      for(const job of jobs){ const c=rawCrew.find(x=>x.job===job); if(c) return {id:c.id,name:c.name}; }
      return null;
    };
    const crew={
      director: pickCrew('Director')||(isTV&&det.created_by?.[0]?{id:det.created_by[0].id,name:det.created_by[0].name}:null),
      writer:   pickCrew('Screenplay','Writer'),
      producer: pickCrew('Executive Producer','Producer'),
      composer: pickCrew('Original Music Composer'),
      dop:      pickCrew('Director of Photography'),
    };
    const videos=(vs.filter(v=>['Trailer','Teaser','Clip'].includes(v.type)&&v.site==='YouTube').slice(0,4)
      .map(v=>({key:v.key,name:v.name,thumb:`https://i.ytimg.com/vi/${v.key}/mqdefault.jpg`})));
    const similar=(det.similar?.results||[]).slice(0,6).map(s=>({
      id:s.id,type,title:s.title||s.name,
      year:(s.release_date||s.first_air_date||'').slice(0,4),
      poster:s.poster_path?IMGC+s.poster_path:''
    }));
    const status=calcStatus(det);
    const tk=bestKey(vs);
    return {id,type,title,year,runtime,genres,tagline:det.tagline||'',overview:det.overview||'',poster,backdrop,lang,trailerKey:tk,cast,crew,videos,similar,status};
  } catch(e){ return null; }
}

function bestKey(vs){
  for(const k of ['Official Trailer','Trailer','Teaser','Clip']){
    const v=vs.find(v=>v.site==='YouTube'&&(v.name.includes(k)||v.type===k));
    if(v) return v.key;
  }
  return vs.find(v=>v.site==='YouTube')?.key||null;
}
function calcStatus(det){
  const rd=new Date(det.release_date||det.first_air_date||'');
  if(isNaN(rd)) return null;
  const diff=(Date.now()-rd)/86400000;
  if(diff>180) return {type:'streaming',platform:'Available on streaming',date:fmt(rd)};
  if(diff>=0)  return {type:'theatres',date:fmt(rd)};
  return {type:'upcoming',date:fmt(rd)};
}
function fmt(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildTrack(){
  const track=document.getElementById('rt');
  const existing=track.querySelectorAll('.reel').length;
  const lm=track.querySelector('.lm-reel'); if(lm) lm.remove();
  for(let i=existing;i<reels.length;i++) track.appendChild(makeReel(reels[i],i));
  const s=document.createElement('div'); s.className='lm-reel';
  s.innerHTML='<div class="spinner"></div>'; track.appendChild(s);
}
function makeReel(m,i){
  const saved=isSaved(m.id);
  const el=document.createElement('div');
  el.className='reel'; el.dataset.id=m.id; el.dataset.i=i;
  el.innerHTML=`
    <img class="reel-bg" src="${m.backdrop}" loading="${i<3?'eager':'lazy'}" alt="">
    <div class="reel-ov"></div>
    <div class="reel-tz" data-i="${i}"></div>
    <div class="reel-meta">
      <div class="reel-title">${m.title}</div>
      <div class="reel-year">${m.year}</div>
      <div class="reel-gtags">${m.genres.map(g=>`<span class="reel-gt">${g}</span>`).join('')}</div>
    </div>
    <button class="reel-bm${saved?' saved':''}" data-mid="${m.id}" onclick="toggleSave(event,'${m.id}')" aria-label="Bookmark">
      <svg viewBox="0 0 24 24" fill="${saved?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
    </button>`;
  return el;
}

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function go(i){
  if(i<0||i>=reels.length||busy) return;
  busy=true; idx=i;
  document.getElementById('rt').style.transform=`translateY(-${i*100}dvh)`;
  if(i>=reels.length-3&&!loading){
    const hasF=reelsFilters.yearFrom||reelsFilters.yearTo||reelsFilters.genres.size>0||reelsFilters.languages.size>0||typeFilter!=='all';
    (hasF?fetchFiltered():fetchMore()).then(buildTrack);
  }
  setTimeout(()=>busy=false,460);
}

/* ═══════════════════════════════════════
   GESTURES
═══════════════════════════════════════ */
function setupGestures(){
  const c=document.getElementById('rc');
  let sx,sy,st;
  c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
  c.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    const dt=Date.now()-st,adx=Math.abs(dx),ady=Math.abs(dy);
    if(dt<250&&adx<14&&ady<14) return;
    if(ady>adx&&ady>38){ if(dy<-38) go(idx+1); else go(idx-1); }
    else if(adx>ady&&adx>48){ if(dx<-48) openDetails(idx); else openWL(); }
  },{passive:true});
  let wt;
  c.addEventListener('wheel',e=>{
    e.preventDefault(); clearTimeout(wt);
    wt=setTimeout(()=>{ if(e.deltaY>20) go(idx+1); else if(e.deltaY<-20) go(idx-1); },55);
  },{passive:false});
  document.addEventListener('keydown',e=>{
    if(screen!=='reel') return;
    if(e.key==='ArrowDown'||e.key==='j') go(idx+1);
    if(e.key==='ArrowUp'||e.key==='k') go(idx-1);
    if(e.key==='ArrowLeft') openDetails(idx);
    if(e.key==='ArrowRight') openWL();
  });
}
function watchEnd(){
  const ob=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting&&!loading){
      const hasF=reelsFilters.yearFrom||reelsFilters.yearTo||reelsFilters.genres.size>0||reelsFilters.languages.size>0||typeFilter!=='all';
      (hasF?fetchFiltered():fetchMore()).then(buildTrack);
    }
  },{threshold:0.1});
  const check=()=>{ const s=document.querySelector('.lm-reel'); if(s) ob.observe(s); else setTimeout(check,500); };
  check();
}

function isSaved(id){ return wl.some(m=>String(m.id)===String(id)); }
function toggleSave(e,id){
  e.stopPropagation();
  const mid=String(id);
  const movie=reels.find(m=>String(m.id)===mid)||curDet;
  if(!movie) return;
  if(isSaved(mid)){ wl=wl.filter(m=>String(m.id)!==mid); showToast('Removed from Watch Later'); }
  else { wl.push(movie); showToast('Saved to Watch Later'); }
  localStorage.setItem('findr_wl',JSON.stringify(wl));
  syncBmBtns(mid);
}
function syncBmBtns(id){
  const saved=isSaved(id);
  document.querySelectorAll(`[data-mid="${id}"]`).forEach(btn=>{
    btn.classList.toggle('saved',saved);
    const svg=btn.querySelector('svg');
    if(svg) svg.setAttribute('fill',saved?'currentColor':'none');
  });
}

async function openDetById(id,type='movie'){
  const existing=reels.find(m=>m.id==id);
  if(existing){ openDetails(reels.indexOf(existing)); return; }
  showToast('Loading…');
  try {
    const e=await enrich({id,media_type:type,backdrop_path:'x'});
    if(e){ reels.push(e); seen.add(e.id); openDetails(reels.length-1); buildTrack(); }
  } catch(err){ showToast('Could not load title'); }
}

async function fetchWatchProviders(id,type){
  try {
    const data=await api(`/${type}/${id}/watch/providers`);
    const results=data.results||{};
    const region=results['IN']||results['US']||Object.values(results)[0];
    if(!region) return [];
    const sources=[...(region.flatrate||[]),...(region.free||[]),...(region.ads||[])];
    const s2=new Set();
    return sources.filter(p=>{ if(s2.has(p.provider_name)) return false; s2.add(p.provider_name); return true; })
      .slice(0,5).map(p=>({name:p.provider_name,url:region.link||null}));
  } catch(e){ return []; }
}

      const linked=watchLinks.map(p=>{ const href=PLATFORM_URLS[p.name]||p.url||null; return href?`<a class="av-platform-link" href="${href}" target="_blank" rel="noopener">${p.name}</a>`:`<span class="av-platform-name">${p.name}</span>`; });

    <div class="ph-back">
      <button class="ph-back-btn" onclick="closePerson()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <span class="ph-back-title">${p.name}</span>
    </div>
    <div class="ph-hero">
      <div class="ph-img-wrap">
        <img class="ph-img" src="${imgSrc}" alt="${p.name}" onerror="this.style.opacity=0.15">
        <div class="ph-img-ring"></div>
      </div>
      <div class="ph-info">
        <div class="ph-name">${p.name}</div>
        <div class="ph-dept">${dept}</div>
        <div class="ph-meta-row">
          <span class="ph-badge">${gender}</span>
          ${age!=null?`<span class="ph-badge">${age} yrs${dday?' (deceased)':''}</span>`:''}
          ${p.popularity?`<span class="ph-badge">★ ${p.popularity.toFixed(1)}</span>`:''}
        </div>
      </div>
    </div>
    <div class="ph-body">
      <div class="ph-stats">
        <div class="ph-stat"><div class="ph-stat-n">${unique.length}</div><div class="ph-stat-l">Total</div></div>
        <div class="ph-stat"><div class="ph-stat-n">${movies}</div><div class="ph-stat-l">Films</div></div>
        <div class="ph-stat"><div class="ph-stat-n">${series}</div><div class="ph-stat-l">Series</div></div>
        <div class="ph-stat"><div class="ph-stat-n">${cast.length}</div><div class="ph-stat-l">Actor</div></div>
        <div class="ph-stat"><div class="ph-stat-n">${crew.length}</div><div class="ph-stat-l">Crew</div></div>
        <div class="ph-stat"><div class="ph-stat-n">${p.popularity?Math.round(p.popularity):'—'}</div><div class="ph-stat-l">Score</div></div>
      </div>
      <div class="ph-sec">
        <div class="ph-lbl">Personal Info</div>
        <div class="ph-info-grid">
          <div><div class="ph-ig-lbl">Born</div><div class="ph-ig-val">${bdayStr}</div></div>
          ${ddayStr?`<div><div class="ph-ig-lbl">Died</div><div class="ph-ig-val">${ddayStr}</div></div>`:''}
          <div><div class="ph-ig-lbl">Place of Birth</div><div class="ph-ig-val">${p.place_of_birth||'—'}</div></div>
          <div><div class="ph-ig-lbl">Known For</div><div class="ph-ig-val">${dept}</div></div>
          ${p.also_known_as?.length?`<div style="grid-column:1/-1"><div class="ph-ig-lbl">Also Known As</div><div class="ph-ig-val">${p.also_known_as.slice(0,4).join(', ')}</div></div>`:''}
          ${langCodes.length?`<div style="grid-column:1/-1"><div class="ph-ig-lbl">Languages in Works</div><div class="ph-lang-tags">${langCodes.map(l=>`<span class="ph-lang-tag">${langName(l)}</span>`).join('')}</div></div>`:''}
        </div>
      </div>
      ${p.biography?`
      <div class="ph-sec">
        <div class="ph-lbl">Biography</div>
        <div class="ph-bio collapsed" id="ph-bio-txt">${p.biography}</div>
        <button class="ph-bio-toggle" onclick="toggleBio()">Read more</button>
      </div>`:''}
      <div class="ph-sec">
        <div class="ph-lbl">Filmography</div>
        <div class="ph-sort-bar">
          <select class="ph-sort-sel" id="pf-sort" onchange="pfSort()">
            <option value="date">By Release Date</option>
            <option value="title">By Title A–Z</option>
            <option value="rating">By Rating</option>
          </select>
          <button class="ph-sort-dir" id="pf-dir" onclick="pfToggleDir()">↑ Asc</button>
          <select class="ph-sort-sel" id="pf-type" onchange="pfSort()">
            <option value="all">All</option>
            <option value="movie">Movies</option>
            <option value="tv">Series</option>
          </select>
          <input class="ph-sort-sel" type="number" id="pf-yfrom" placeholder="From yr" style="width:82px" oninput="pfSort()">
          <input class="ph-sort-sel" type="number" id="pf-yto"   placeholder="To yr"   style="width:82px" oninput="pfSort()">
          <span class="ph-film-count" id="pf-count"></span>
        </div>
        <div class="ph-film-list" id="pf-list"></div>
      </div>
    </div>`;

  pfRender(unique);
}

function toggleBio(){
  const txt=document.getElementById('ph-bio-txt');
  const btn=txt?.nextElementSibling;
  if(!txt) return;
  const c=txt.classList.toggle('collapsed');
  if(btn) btn.textContent=c?'Read more':'Show less';
}

function pfSort(){
  if(!currentPerson) return;
  pfSortKey=document.getElementById('pf-sort')?.value||'date';
  pfTypeF=document.getElementById('pf-type')?.value||'all';
  pfYearFrom=document.getElementById('pf-yfrom')?.value||'';
  pfYearTo=document.getElementById('pf-yto')?.value||'';
  const cast=currentPerson.credits?.cast||[];
  const crew=currentPerson.credits?.crew||[];
  const s4=new Set();
  const unique=[...cast,...crew].filter(c=>{ const k=c.id+'_'+c.media_type; if(s4.has(k)) return false; s4.add(k); return true; });
  pfRender(unique);
}

function pfToggleDir(){
  pfSortDir=pfSortDir==='asc'?'desc':'asc';
  const btn=document.getElementById('pf-dir');
  if(btn) btn.textContent=pfSortDir==='asc'?'↑ Asc':'↓ Desc';
  pfSort();
}

function pfRender(items){
  let list=pfTypeF==='movie'?items.filter(c=>c.media_type==='movie'):pfTypeF==='tv'?items.filter(c=>c.media_type==='tv'):items;
  if(pfYearFrom) list=list.filter(c=>parseInt((c.release_date||c.first_air_date||'0').slice(0,4))>=parseInt(pfYearFrom));
  if(pfYearTo)   list=list.filter(c=>parseInt((c.release_date||c.first_air_date||'9999').slice(0,4))<=parseInt(pfYearTo));
  list.sort((a,b)=>{
    let va,vb;
    if(pfSortKey==='date'){
      va=(a.release_date||a.first_air_date||'0000').slice(0,4);
      vb=(b.release_date||b.first_air_date||'0000').slice(0,4);
    } else if(pfSortKey==='title'){
      va=(a.title||a.name||'').toLowerCase();
      vb=(b.title||b.name||'').toLowerCase();
    } else { va=a.vote_average||0; vb=b.vote_average||0; }
    if(va<vb) return pfSortDir==='asc'?-1:1;
    if(va>vb) return pfSortDir==='asc'?1:-1;
    return 0;
  });
  const el=document.getElementById('pf-list');
  const cnt=document.getElementById('pf-count');
  if(!el) return;
  if(cnt) cnt.textContent=`${list.length} title${list.length!==1?'s':''}`;
  if(!list.length){ el.innerHTML='<div class="ph-empty">No titles match these filters</div>'; return; }
  el.innerHTML=list.map(c=>{
    const title=c.title||c.name||'Untitled';
    const year=(c.release_date||c.first_air_date||'').slice(0,4);
    const poster=c.poster_path?`https://image.tmdb.org/t/p/w185${c.poster_path}`:'';
    const role=c.character||c.job||'';
    const type=c.media_type==='tv'?'Series':'Film';
    const rating=c.vote_average?`★ ${c.vote_average.toFixed(1)}`:'';
    return `<div class="ph-film-item" onclick="openDetById(${c.id},'${c.media_type||'movie'}')">
      <img class="ph-film-poster" src="${poster}" alt="" loading="lazy" onerror="this.style.opacity=0.15">
      <div class="ph-film-info">
        <div class="ph-film-title">${title}</div>
        <div class="ph-film-meta">${type}${year?' · '+year:''}${rating?' · '+rating:''}</div>
        ${role?`<div class="ph-film-role">${role}</div>`:''}
      </div>
      <div class="ph-film-year">${year||'—'}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function esc(s){ return (s||'').replace(/'/g,"\\'"); }
function setLoad(p){ document.getElementById('lb').style.width=p+'%'; }
let toastT;
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function showHint(){ const h=document.createElement('div'); h.className='sh'; h.textContent='↑↓ scroll  ·  ← details  ·  → saved'; document.getElementById('app').appendChild(h); setTimeout(()=>h.remove(),5000); }
</script>
</body>
